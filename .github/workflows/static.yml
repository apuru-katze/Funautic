name: Deploy production and development

on:
  push:
    branches:
      - main
      - dev/november_week2

  workflow_dispatch:

env:
  PRODUCTION_REF: main
  DEVELOPMENT_REF: dev/november_week2
  SITE_BASE_URL: https://apuru-katze.github.io/Funautic

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCTION_REF }}
          path: source/production

      - name: Checkout development branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEVELOPMENT_REF }}
          path: source/development

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Install Packwiz
        run: |
          go install github.com/packwiz/packwiz@latest

      - name: Refresh Packwiz hashes
        shell: bash
        run: |
          set -euo pipefail

          for channel in production development; do
            modpack_dir="source/${channel}/modpack"
            test -f "${modpack_dir}/pack.toml"
            (
              cd "${modpack_dir}"
              packwiz refresh --build
            )
          done

      - name: Prepare production and development output
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          build_channel() {
            local channel="$1"
            local source_dir="source/${channel}"
            local target_dir="out/${channel}"
            local stage_dir="${RUNNER_TEMP}/funautic-${channel}"
            local packwiz_url="${SITE_BASE_URL}/${channel}/modpack/pack.toml"

            test -d "${source_dir}/modpack"
            test -d "${source_dir}/mmcpack"
            test -d "${source_dir}/mrpack"

            mkdir -p "${target_dir}/modpack" "${stage_dir}"
            cp -a "${source_dir}/modpack/." "${target_dir}/modpack/"
            cp -a "${source_dir}/mmcpack" "${stage_dir}/mmcpack"
            cp -a "${source_dir}/mrpack" "${stage_dir}/mrpack"

            # Point each client package at its own fixed Packwiz channel.
            sed -i "s#^source=.*#source=${packwiz_url}#" \
              "${stage_dir}/mmcpack/minecraft/unsup.ini" \
              "${stage_dir}/mrpack/overrides/unsup.ini"

            (
              cd "${stage_dir}/mmcpack"
              zip -q -r "${GITHUB_WORKSPACE}/${target_dir}/funautic.zip" .
            )

            (
              cd "${stage_dir}/mrpack"
              zip -q -r "${GITHUB_WORKSPACE}/${target_dir}/funautic.mrpack" .
            )

            cat > "${target_dir}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Funautic ${channel} modpack</title>
          </head>
          <body>
            <h1>Funautic ${channel} modpack</h1>
            <ul>
              <li><a href="funautic.zip">Download MultiMC pack</a></li>
              <li><a href="funautic.mrpack">Download Modrinth pack</a></li>
              <li><a href="modpack/pack.toml">Packwiz manifest</a></li>
            </ul>
          </body>
          </html>
          EOF
          }

          build_channel production
          build_channel development

          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Funautic Modpack</title>
          </head>
          <body>
            <h1>Funautic Modpack</h1>
            <ul>
              <li><a href="production/">Production</a></li>
              <li><a href="development/">Development</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Validate output
        run: |
          set -euo pipefail

          for channel in production development; do
            test -s "out/${channel}/funautic.zip"
            test -s "out/${channel}/funautic.mrpack"
            test -s "out/${channel}/modpack/pack.toml"
            test -s "out/${channel}/modpack/index.toml"
            unzip -t "out/${channel}/funautic.zip"
            unzip -t "out/${channel}/funautic.mrpack"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
