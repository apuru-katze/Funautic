name = "With Shader"
description = "Shader dan optimasinya"

# Button Choice
[flavor_groups.dh]
name = "Distant Visual"
description = "Menambahkan Chunk View Lebih jauh"
side = "client"
[[flavor_groups.dh.choices]]
